name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # torch-sparse is published at https://data.pyg.org/whl/ for a subset of
  # torch releases only; check the index before raising this.
  TORCH_VERSION: "2.4.1"

jobs:
  test:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PyTorch (CPU) and torch-sparse
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${TORCH_VERSION}"
          fi
          pip install torch-scatter torch-sparse --only-binary :all: \
            -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
      - name: Install the package
        run: pip install ".[io,test]"
      - name: Run the tests
        run: pytest --cov grass_mil --cov-report xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v7
