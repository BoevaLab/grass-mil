name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

env:
  # Bump these together. torch-scatter/torch-sparse are only published for a
  # subset of torch releases: https://data.pyg.org/whl/ has no wheels beyond
  # torch 2.12, so raising TORCH_VERSION past it means those extensions would
  # have to build from source, which fails on macOS (PyTorch's own
  # c10/util/strong_type.h specializes std::is_arithmetic, which recent libc++
  # rejects). Check the index before changing this.
  TORCH_VERSION: "2.12.0"
  PYTHON_VERSION: "3.12"

jobs:
  run-tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Linux resolves CUDA builds by default, which are ~3GB and useless on a
      # CPU runner. macOS wheels on PyPI are already CPU/MPS only, and the
      # download.pytorch.org cpu index does not publish macOS builds.
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${TORCH_VERSION}"
          fi

      # Prebuilt binaries. Never let these build from source; see the note on
      # TORCH_VERSION above.
      - name: Install PyG compiled extensions
        run: |
          pip install torch-scatter torch-sparse \
            --only-binary :all: \
            -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"

      - name: Install the package
        run: pip install ".[interpretability,io]" pytest

      - name: Show key package versions
        run: |
          python --version
          python - <<'PY'
          import importlib

          checks = [
              "torch",
              "torch_geometric",
              "torch_scatter",
              "torch_sparse",
              "lightning",
              "pytorch_lightning",
              "torchmetrics",
              "omegaconf",
              "hydra",
              "numpy",
              "pandas",
              "scipy",
              "sklearn",
              "plotly",
          ]
          for name in checks:
              mod = importlib.import_module(name)
              print(f"{name}=={getattr(mod, '__version__', 'unknown')}")
          PY

      - name: Run pytest
        run: pytest -v

  code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PyTorch (CPU) and PyG extensions
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install torch-scatter torch-sparse \
            --only-binary :all: \
            -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"

      - name: Run tests and collect coverage
        run: |
          pip install ".[interpretability,io]" pytest "pytest-cov[toml]"
          pytest --cov grass_mil

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  packaging:
    name: Install from source and run the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Deliberately the oldest supported Python, so `requires-python` is
      # exercised at its floor rather than only at the version CI happens to use.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # A plain, unpinned pip install: this is the path a downstream user takes,
      # and it is the one that silently rots when the package layout or the
      # config tree moves. It deliberately does NOT pin torch, so a dependency
      # that breaks on the latest release shows up here first.
      - name: Install the package
        run: pip install .

      - name: Entrypoints resolve packaged configs from an unrelated directory
        run: |
          mkdir -p "${RUNNER_TEMP}/elsewhere"
          cd "${RUNNER_TEMP}/elsewhere"
          grass-mil-train --help
          grass-mil-report --help
          python -c "import grass_mil, grass_mil.configs; print(grass_mil.__file__)"

      - name: Packaging contract tests
        run: |
          pip install pytest
          pytest -v tests/test_packaging.py
