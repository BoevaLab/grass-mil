name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run-tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up conda env (spatial-pinned)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: spatial
          environment-file: environment.ci-spatial.yaml
          auto-activate: false
          mamba-version: "*"
          channels: pyg,pytorch,conda-forge,defaults
          channel-priority: flexible

      - name: Show Python and key package versions
        shell: bash -el {0}
        run: |
          python --version
          python - <<'PY'
          import importlib

          checks = [
              "torch",
              "lightning",
              "pytorch_lightning",
              "omegaconf",
              "hydra",
              "plotly",
              "torch_geometric",
          ]
          for name in checks:
              mod = importlib.import_module(name)
              print(f"{name}=={getattr(mod, '__version__', 'unknown')}")
          PY

      - name: Run pytest
        shell: bash -el {0}
        run: pytest -v

  code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up conda env (spatial-pinned)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: spatial
          environment-file: environment.ci-spatial.yaml
          auto-activate: false
          mamba-version: "*"
          channels: pyg,pytorch,conda-forge,defaults
          channel-priority: flexible

      - name: Run tests and collect coverage
        shell: bash -el {0}
        run: |
          pip install pytest-cov[toml]
          pytest --cov grass_mil

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  packaging:
    name: Install from source and run the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # A plain pip install, deliberately outside conda: this is the path a
      # downstream user takes, and it is the one that silently rots when the
      # package layout or the config tree moves.
      - name: Install the package
        run: pip install .

      - name: Entrypoints resolve packaged configs from an unrelated directory
        run: |
          mkdir -p "${RUNNER_TEMP}/elsewhere"
          cd "${RUNNER_TEMP}/elsewhere"
          grass-mil-train --help
          grass-mil-report --help
          python -c "import grass_mil, grass_mil.configs; print(grass_mil.__file__)"

      - name: Packaging contract tests
        run: |
          pip install pytest
          pytest -v tests/test_packaging.py
