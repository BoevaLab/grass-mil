# @package _global_

defaults:
  - override /data: spatial_omics
  - override /model: components
  - override /trainer: default

data:
  raw_manifest_path: ${paths.data_dir}/dummy/manifest.csv
  processed_dir: ${paths.data_dir}/dummy/processed
  coord_scale_um: 1.0
  sample_unit: tile
  use_molecular_features: true
  tiling:
    tile_size_um: 300.0
    stride_um: 300.0
  categorical_features:
    include_labels: ["cell type"]
  h5ad:
    coord_source: obsm
    coord_key: spatial
    categorical_label_columns: ["cell type"]
  split:
    train_val_test_split: [1.0, 0.0, 0.0]
    split_by: sample

model:
  flags:
    use_attention: true
    use_ssl: true
  encoder:
    conv_type: gine
    use_edge_attr: true
    edge_attr_dim: 2
  ssl:
    predictor:
      hidden_size: 256
