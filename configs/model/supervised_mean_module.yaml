_target_: src.models.supervised_mean_module.SupervisedMeanModule

flags:
  use_ssl: false

encoder:
  input_dim: 0
  hidden_dim: 128
  out_dim: 128
  num_layers: 3
  dropout: 0.1
  conv_type: gin
  norm: batchnorm
  jk: last
  act: relu
  pooling: mean
  set2set_steps: 3
  gat_heads: 4
  use_edge_attr: false
  edge_weight_index: 0
  edge_attr_dim: null

graph_head:
  input_dim: 128
  output_dim: 1
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

loss:
  loss_type: ${task.loss}

optim: ${optim}
scheduler: ${scheduler}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
freeze_encoder: false
