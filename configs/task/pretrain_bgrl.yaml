# @package _global_

defaults:
  - override /scheduler: cosine_step

task:
  name: pretrain_bgrl
  aggregation: mean
  bag_key: region_id
  bag_fallback_key: sample_id
  max_instances_per_bag: 0
  instance_sampling: all
  target_type: binary
  target_columns: null
  loss: categorical_bce
  lr_warmup:
    enabled: true
    warmup_steps: 1000
    start_factor: 0.1
  warmup_steps: 1000
  total_steps: 10000
  momentum: 0.99
  momentum_min: 0.99
  drop_edge_p1: 0.2
  drop_edge_p2: 0.2
  drop_feat_p1: 0.2
  drop_feat_p2: 0.2
