name: spatial
channels:
  - pyg
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip=24.2
  - setuptools=72.1.0
  - wheel=0.43.0
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - anndata=0.10.9
  - pytest=9.0.2
  - rich=13.9.2
  - pytorch=2.4.1
  - pyg=2.6.1
  - pytorch-scatter=2.1.2
  # Prebuilt from the pyg channel. Do NOT move this to the pip section:
  # pip has no macOS-arm64 wheel, so it builds from source, and PyTorch's
  # own c10/util/strong_type.h specializes std::is_arithmetic, which newer
  # libc++ (Xcode 26) rejects outright. Any pip-built torch C++ extension
  # fails on the macOS runner for that reason.
  - pytorch-sparse=0.6.18
  - pip:
      - lightning==2.5.6
      - pytorch-lightning==2.5.6
      - torchmetrics==1.8.2
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - omegaconf==2.3.0
      - plotly==5.24.1
      - rootutils==1.0.7
      - shapely==2.0.6
      - sh==2.2.2
