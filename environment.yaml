# Conda alternative to the pip install in the README; conda resolves the
# compiled stack (PyTorch, PyG, torch-sparse) together.
name: grass-mil

channels:
  - pyg
  - pytorch
  - conda-forge

dependencies:
  - python=3.12
  - pytorch=2.4
  - pyg=2.*
  - pytorch-sparse
  - pytorch-scatter
  - pip
  - pip:
      - -e .[io,test]
