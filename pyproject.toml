[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grass-mil"
version = "0.1.0"
description = "Geometric deep learning framework for spatial omics data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.0",
  "lightning>=2.0",
  # Imported directly by utils/{pylogger,rich_utils,logging_utils}.py rather
  # than relied on transitively through lightning.
  "lightning-utilities>=0.10",
  "torchmetrics>=0.11.4",
  "torch-geometric>=2.5",
  "hydra-core==1.3.7",
  "hydra-colorlog==1.2.0",
  "omegaconf",
  "numpy",
  "pandas",
  "scipy>=1.11",
  "scikit-learn",
  # Imported directly by interpretability/core/transfer.py to persist niche
  # transfer bundles; not relied on transitively through scikit-learn.
  "joblib",
  "rich",
  "rootutils",
]

[project.optional-dependencies]
interpretability = ["plotly", "umap-learn", "jinja2"]
report = ["kaleido", "playwright"]
spatial-stats = ["squidpy", "scanpy", "anndata"]
io = ["anndata", "shapely"]
# SingleCellExperiment / .rds inputs. Also needs an R runtime with Bioconductor;
# rpy2 alone is not sufficient.
sce = ["rpy2"]

[project.scripts]
grass-mil-train = "grass_mil.train:main"
grass-mil-eval = "grass_mil.eval:main"
grass-mil-loocv = "grass_mil.loocv:main"
grass-mil-predict = "grass_mil.inference.predict:main"
grass-mil-report = "grass_mil.interpretability.report_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grass_mil"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 99
target-version = "py311"  # matches requires-python floor
exclude = ["logs", "data"]

[tool.ruff.lint]
# E402: train.py/eval.py must call rootutils.setup_root() before importing the
#       package, so module-level imports legitimately follow executable code.
# E501: a handful of long string literals the formatter will not wrap.
# F401/F841/E203 were previously ignored too. They are now clean and enforced,
# so unused imports and dead locals cannot creep back in.
ignore = ["E402", "E501"]
