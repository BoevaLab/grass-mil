[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grass-mil"
version = "1.1.0"
description = "GRASS-MIL: graph-based representation and discovery of phenotype-associated spatial structures with multiple instance learning"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Lovro Rabuzin" },
  { name = "Josephine Yates" },
  { name = "Mina Xu" },
  { name = "Valentina Boeva" },
]
dependencies = [
  "torch>=2.1",
  "lightning>=2.1",
  "torch-geometric>=2.5",
  "hydra-core>=1.3.5,<1.4",
  "hydra-colorlog==1.2.0",
  "omegaconf>=2.3",
  "numpy",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "joblib",
  "matplotlib>=3.7",
  "rich",
]

[project.optional-dependencies]
# h5ad inputs and polygon units.
io = ["anndata>=0.10", "shapely>=2.0"]
# SingleCellExperiment (.rds) inputs; also needs R with Bioconductor.
sce = ["rpy2>=3.5"]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/BoevaLab/grass-mil"
Preprint = "https://www.biorxiv.org/content/10.64898/2026.10.08.757722v1"

[project.scripts]
grass-mil-train = "grass_mil.train:main"
grass-mil-nested-cv = "grass_mil.nested_cv:main"
grass-mil-predict = "grass_mil.predict:main"
grass-mil-extract = "grass_mil.extract:main"
grass-mil-niches = "grass_mil.niches.cli:main"
grass-mil-metaclusters = "grass_mil.niches.replication.cli:main"
grass-mil-spatial-stats = "grass_mil.spatial.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grass_mil"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = ["--strict-markers"]
filterwarnings = [
  # Lightning's hints about dataloader workers and logging intervals.
  "ignore::lightning.fabric.utilities.warnings.PossibleUserWarning",
]
markers = ["slow: the end-to-end chain on synthetic data (deselect with -m 'not slow')"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = ["logs", "data"]

[tool.ruff.lint]
ignore = ["E501"]
