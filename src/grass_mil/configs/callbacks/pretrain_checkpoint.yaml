# Pretraining: keep a checkpoint every N optimizer steps, plus last.ckpt.
defaults:
  - model_checkpoint
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step:07d}"
  monitor: null
  save_last: true
  save_top_k: -1
  every_n_train_steps: 5000
  auto_insert_metric_name: false
