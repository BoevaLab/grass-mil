# A cohort of cell tables listed in a manifest, cut into graph units, with
# labels attached per unit. See docs/data_preparation.md.
defaults:
  - sampler: ego_graph
  - _self_

_target_: grass_mil.data.SpatialOmicsDataModule

# CSV with sample_id, input_path and optionally region_id, input_type,
# polygons_path (paths relative to the manifest).
manifest_path: ${paths.data_dir}/manifest.csv
# Graphs are built here once and reused while the settings below are unchanged.
processed_dir: ${paths.data_dir}/processed
force_precompute: false

# What one bag is: a whole region, a square tile (data.tiling), or a polygon of
# the region's polygons_path.
unit: region # region | tile | polygon
coord_scale_um: 1.0 # coordinates are multiplied by this
min_cells: 10 # units with fewer cells are dropped
tiling:
  size: 200.0
  stride: 200.0

input:
  coord_columns: [x, y]
  obsm_key: spatial # h5ad: coordinates in obsm[obsm_key]; null = obs coord_columns
  reduced_dim: null # SCE: coordinates in reducedDim; null = colData coord_columns
  cell_id_column: null
  cell_type_column: cell_type # null = no cell types (features only)
  features: all # continuous node features: all | [names] | null (cell type only)
  h5ad_layer: null
  sce_assay: null
  sep: ","

graph:
  edge_features: [log_distance, neighbor]
  neighbor_cutoff: 20.0 # contact distance, in coordinate units
  log_distance_bounds: [2.0, 5.0] # ln-length mapped to [0, 1]

feature_reducer:
  name: identity # identity | pca
  n_components: 32
  fit_on: all # all | train | sample
  state_from: null # processed_index.json of a cohort whose PCA basis to reuse

labels:
  file: null # CSV with one row per labelled id
  id_column: region_id # unit, region or sample ids
  columns: ${oc.select:task.target_columns,null}
  patient_column: null # grouping for splits; never a target
# Skip units without a label (supervised training); pretraining uses all units.
labelled_only: true

split:
  ratios: [0.8, 0.1, 0.1] # random train/val/test split, grouped by patient
  seed: 0
  # Explicit ids (lists or .json/.txt files) replace the random split.
  train: null
  val: null
  test: null

# Validation scores a fixed subset of roots per unit; test scores every cell.
val_roots_per_unit: 1024
num_workers: 0
pin_memory: false
