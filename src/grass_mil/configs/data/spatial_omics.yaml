defaults:
  - sampler: shadow_custom
  - _self_

_target_: grass_mil.data.spatial_omics_datamodule.SpatialOmicsDataModule

data_dir: ${paths.data_dir}
raw_manifest_path: ${paths.data_dir}/raw/manifest.csv
processed_dir: ${paths.data_dir}/processed/spatial_omics

batch_size: 1
num_workers: 0
pin_memory: False

coord_scale_um: 1.0
sample_unit: tile # tile | full
reducer_scope: sample # sample | dataset
keep_raw_molecular: false
force_precompute: false
min_cells: 10
use_molecular_features: true

categorical_features:
  include_labels: ["cell_type"]

split:
  train_val_test_split: [0.8, 0.1, 0.1]
  split_by: sample # sample | region | patch
  loocv:
    enabled: false
    fold_unit: region # region | sample
    holdout_id: null
    validation_strategy: heldout_fold_items # heldout_fold_items | patches_from_train_items
    val_ratio: 0.1 # exactly 0.0 disables val; non-zero guarantees at least one val item
    seed: 42

manifest:
  sample_id: sample_id
  input_path: input_path
  input_type: input_type
  region_id: region_id
  polygons_path: polygons_path

csv:
  sep: ","
  coord_columns: ["x", "y"]
  cell_id_column: cell_id
  categorical_label_columns: []
  molecular_columns: null

h5ad:
  coord_source: obsm # obs | obsm
  coord_key: spatial
  coord_columns: ["x", "y"]
  cell_id_column: null
  categorical_label_columns: []
  molecular_layer: null
  molecular_features: null

sce:
  assay_name: null
  coord_source: colData # colData | reducedDims
  coord_key: null
  coord_columns: ["x", "y"]
  cell_id_column: null
  categorical_label_columns: []
  transpose_assay: true
  molecular_features: null

graph_builder:
  name: delaunay
  kwargs:
    edge_features: ["distance", "neighbor"]
    neighbor_cutoff_um: 20.0

feature_reducer:
  name: identity
  fit_mode: train_only # train_only | global
  kwargs: {}

# `sampler` comes from the data/sampler group (shadow_custom by default;
# `data/sampler=ego_graph_mil` is the preprint MIL setting). Override single
# keys as `data.sampler.runtime.<key>=...`.
val_sampler: null
# Test/predict loader; null derives an all-roots, unweighted variant of `sampler`.
test_sampler: null

tiling:
  tile_size_um: 200.0
  stride_um: 200.0
  min_cells: 10

graph_labels:
  label_file: null
  id_column: id
  tasks: null
  scope: region

transforms: []
