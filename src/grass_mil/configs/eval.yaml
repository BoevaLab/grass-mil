# @package _global_

defaults:
  - _self_
  - data: spatial_omics # choose datamodule with `test_dataloader()` for evaluation
  - model: supervised_module
  - optim: adamw
  - scheduler: cosine_epoch
  # `task` is merged after `model`, `optim` and `scheduler` so that a task
  # preset can override them. finetune_mil sets the per-class head and
  # attention widths, and pretrain_bgrl overrides the scheduler; both are
  # silently discarded if `task` is listed first.
  - task: finetune_mean
  - logger: null
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - callbacks: none
  # Regime presets compose here too (`regime=mil`), so the evaluated model
  # matches the checkpoint.
  - regime: null

task_name: "eval"

tags: ["dev"]

# passing checkpoint path is necessary for evaluation
ckpt_path: ???
