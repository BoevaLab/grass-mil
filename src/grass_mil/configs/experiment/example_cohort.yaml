# @package _global_
# Template describing one cohort. Copy it to my_cohort.yaml, fill in paths and
# column names, and pass experiment=my_cohort to every command:
#
#   grass-mil-train      experiment=my_cohort regime=pretrain
#   grass-mil-nested-cv  experiment=my_cohort model.init_from_ckpt=<pretrain>/checkpoints/last.ckpt
#   grass-mil-extract    experiment=my_cohort extract.nested_cv_summary=<nested_cv>/nested_cv_summary.json

paths:
  data_dir: /path/to/my_cohort

data:
  manifest_path: ${paths.data_dir}/manifest.csv # sample_id,input_path[,region_id]
  processed_dir: ${paths.data_dir}/processed
  unit: region
  coord_scale_um: 1.0
  input:
    coord_columns: [x, y]
    cell_id_column: cell_id
    cell_type_column: cell_type
    features: [area] # continuous node features; null for cell type only
  graph:
    neighbor_cutoff: 20.0 # contact distance in coordinate units
  labels:
    file: ${paths.data_dir}/labels.csv # region_id,label,patient_id
    id_column: region_id
    patient_column: patient_id

task:
  target_columns: [label]

nested_cv:
  folds_file: ${paths.data_dir}/folds.json # JSON list of lists of region ids
