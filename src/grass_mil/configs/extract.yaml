# grass-mil-extract: per-cell outputs (embeddings, attention space, logits) of
# trained models over every cell of every unit.
#
#   grass-mil-extract experiment=my_cohort extract.nested_cv_summary=<run>/nested_cv_summary.json
#   grass-mil-extract experiment=my_cohort +extract.models.final=<run>/checkpoints/last.ckpt
#
# Models are rebuilt from their checkpoints, including the ego-graph settings
# they were trained with; `data` only needs to point at the same cohort.
defaults:
  - train
  - _self_

task_name: extract

extract:
  # One model per outer fold of a cross-validation (held-out units recorded) ...
  nested_cv_summary: null
  # ... and/or explicit {name: checkpoint} models.
  models: {}
  output_dir: ${paths.output_dir}/cells
  units: null # subset of unit ids (list or file); null = every unit
  batch_size: 512 # ego-graphs per forward pass
  device: auto # auto | cpu | cuda
  resume: true
