enabled: false
instance_filename: instance_table.csv
spatial_filename: spatial_table.csv
id_column: instance_id
bag_id_column: bag_id
composition_label: cell_type
composition_prefix: comp_
embedding_prefix: inst_emb
score_column: score
# How to export `score` from `instance_logits`.
# - sigmoid: sigmoid(logit[score_logit_index]) (legacy/default)
# - identity: raw logit[score_logit_index] (useful for survival hazard-style outputs)
# - softmax: softmax(logits)[score_logit_index] (class probability)
score_mode: sigmoid
# Which logit column to project into `score` (0-based).
score_logit_index: 0
attention_column: attention
# Which attention channel becomes the canonical `attention` column when the
# head emits one channel per class. null selects the last channel (the
# positive class for binary tasks). Per-class columns are always exported
# as attention_c{j} alongside the raw attention_logit_c{j}.
attention_class_index: null
require_composition: true

spatial:
  enabled: false
  undirected: true
