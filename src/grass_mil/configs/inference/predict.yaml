# @package _global_

defaults:
  - _self_
  - /data: spatial_omics
  - /model: supervised_module
  - /optim: adamw
  - /scheduler: cosine_epoch
  # `task` is merged after `model`, `optim` and `scheduler` so a task preset
  # can override them. finetune_mil sets the per-class head and attention
  # widths; listed first, they are silently discarded and the model is built
  # narrower than the checkpoint it is asked to load.
  - /task: finetune_mean
  - /trainer: default
  - /paths: default
  - /extras: default
  - /hydra: default
  - metrics: default
  - aggregation: default
  - embeddings: default
  - interpretability: default

task_name: "predict"
tags: ["dev"]

ckpt_path: ???

predict:
  save_predictions: true
  save_metrics: true
  include_targets: true
  include_attention: true
  output_subdir: predictions

output:
  predictions_filename: predictions.csv
  metrics_filename: metrics.json
  summary_filename: inference_summary.json
