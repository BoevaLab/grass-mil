# Every builtin analysis enabled. Slower than the default preset:
# Moran's I and Ripley scale with niche size and permutation count.
defaults:
  - default
  - _self_

enabled:
  - niche_profiles
  - margin_attribution
  - neighborhood_enrichment
  - per_niche_cell_type_enrichment
  - filtration_curves
  - morans_i
  - ripley
  # Cell-level: require cell_table/cell_edge_table from predict.
  - cell_type_enrichment_per_niche
  - cell_type_moran_per_niche
  - niche_label_moran
  - cell_filtration_curves
  - cell_type_ripley_per_niche
