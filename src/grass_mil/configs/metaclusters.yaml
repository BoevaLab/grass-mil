# grass-mil-metaclusters (optional): replication of niches across the models of
# a cross-validation (see docs/niche_analysis.md).
#
#   grass-mil-metaclusters cells_dir=<extract output>/cells
defaults:
  - _self_
  - paths: default
  - hydra: default

task_name: metaclusters
cells_dir: ??? # one cache per fold model (written by grass-mil-extract from a nested CV)
output_dir: ${paths.output_dir}
stage: all # all | cluster | match | transfer | basis
positive_class: 1
positive_name: positive
# Niche discovery of every model; same keys as `clustering` of grass-mil-niches.
clustering: {}
n_boot: 2000

match:
  threshold: null # Hellinger distance threshold; null = scan
  scan: [0.15, 0.6, 46] # start, stop, number of thresholds
  min_models: 3 # a metacluster is replicated when found by this many models

basis:
  enabled: true
  model: null # model whose space defines the partition (null = the first)
  space: embedding # attention | embedding
  k: 20
  sample_size: 300000
  seed: 0
