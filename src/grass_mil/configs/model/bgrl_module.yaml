defaults:
  - encoder: gin
  - _self_

_target_: grass_mil.models.bgrl_module.BGRLModule
_recursive_: false

# `encoder` comes from the model/encoder group (override with
# `model/encoder=gine_length`).

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

optim: ${oc.select:optim,null}
scheduler: ${oc.select:scheduler,null}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
