_target_: grass_mil.models.bgrl_module.BGRLModule
_recursive_: false

encoder:
  input_dim: 0
  hidden_dim: 128
  out_dim: 128
  num_layers: 3
  dropout: 0.1
  conv_type: gin
  norm: batchnorm
  jk: last
  act: relu
  pooling: mean
  set2set_steps: 3
  gat_heads: 4
  use_edge_attr: false
  edge_weight_index: 0
  edge_attr_dim: null

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

optim: ${oc.select:optim,null}
scheduler: ${oc.select:scheduler,null}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
