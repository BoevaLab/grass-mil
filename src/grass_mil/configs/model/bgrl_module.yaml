_target_: grass_mil.models.bgrl_module.BGRLModule
_recursive_: false

encoder:
  input_dim: 0
  hidden_dim: 128
  out_dim: 128
  num_layers: 3
  dropout: 0.1
  conv_type: gin
  norm: batchnorm
  jk: last
  act: relu
  pooling: mean
  gat_heads: 4
  use_edge_attr: false
  edge_weight_index: 0
  edge_attr_dim: null
  # Selects a single scalar edge column (the edge length) for GINE message
  # passing; null passes the whole edge_attr vector through.
  edge_feature_index: null
  # Learned embedding of a categorical node label, summed with the projection
  # of the continuous features. null disables it (features come from `x` only).
  categorical_embedding: null

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

optim: ${oc.select:optim,null}
scheduler: ${oc.select:scheduler,null}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
