# Small GIN encoder without edge features: a lightweight default for smoke runs.
# `input_dim: 0` lets the datamodule report the continuous node-feature width.
input_dim: 0
hidden_dim: 128
out_dim: 128
num_layers: 3
dropout: 0.1
conv_type: gin
norm: batchnorm
jk: last
act: relu
pooling: mean
gat_heads: 4
use_edge_attr: false
edge_weight_index: 0
edge_attr_dim: null
edge_feature_index: null
categorical_embedding: null
train_eps: true
input_init: xavier
