# Ego-graph encoder: cell-type embedding + projected continuous features,
# GINE layers conditioned on one edge feature, max pooling over the ego-graph.
# Input widths (features, cell types, edge features) come from the data.
hidden_dim: 256
out_dim: 256
num_layers: 4 # keep equal to data.sampler.depth
dropout: 0.0
norm: layernorm # layernorm | batchnorm | none
jk: last # last | concat | max | sum
act: relu # relu | gelu | leaky_relu
pooling: max # max | mean | sum
mlp_ratio: 2 # GINE MLP width = mlp_ratio * hidden_dim
train_eps: true
# Column of data.graph.edge_features seen by the convolutions (0 = the first,
# log_distance by default); null = all columns.
edge_feature: 0
input_init: xavier # xavier | default
# Cell type standing in for a masked node during augmentation; null reserves an
# extra embedding row instead.
unassigned_cell_type: null
