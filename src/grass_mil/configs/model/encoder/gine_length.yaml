# GRASS-MIL encoder (preprint defaults): 4 GINE layers of width 256 conditioned
# on the bounded log edge length, layernorm, max pooling over the ego-graph,
# cell identity through a learned embedding summed with the projection of the
# continuous node features. Every value is a plain Hydra key and can be
# overridden (e.g. `model.encoder.num_layers=3 model.encoder.hidden_dim=128`).
#
# `input_dim: 0` lets the datamodule report the continuous node-feature width
# (0 for cell-type-only cohorts, 1 when cell size is present). Likewise
# `num_embeddings: null` and `column_index: null` are resolved from the
# processed dataset's label map and categorical slices.
input_dim: 0
hidden_dim: 256
out_dim: 256
num_layers: 4
dropout: 0.0
conv_type: gine
norm: layernorm
jk: last
act: relu
pooling: max
gat_heads: 4

# Message passing reads exactly one edge column. With the graph builder's
# `edge_features: [log_distance, neighbor]` (preprint), index 0 is the bounded
# log edge length clip((ln d - 2)/3, 0, 1).
use_edge_attr: true
edge_weight_index: 0
edge_attr_dim: 1
edge_feature_index: 0

# Learnable GIN epsilon and xavier-initialised input embeddings, as in the preprint.
train_eps: true
input_init: xavier

categorical_embedding:
  label: cell_type
  num_embeddings: null
  column_index: null
  # Reserve a trailing row so augmentations can mark a dropped node
  # "unassigned" without resizing the table. Alternatively set
  # `reserve_unassigned: false` and `unassigned_label: other` to reuse an
  # existing category as the unassigned token.
  reserve_unassigned: true
  unassigned_label: null
  unassigned_index: null
