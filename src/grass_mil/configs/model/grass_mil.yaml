# GRASS-MIL: ego-graph encoder, linear (or MLP) instance head and projected
# gated attention with one channel per class, pooled in logit space.
defaults:
  - encoder: gine
  - _self_

_target_: grass_mil.models.SupervisedModule
_recursive_: false

head:
  num_layers: 1 # 1 = linear head; 2 = MLP
  hidden_dim: null # MLP hidden width (null = embedding width)
  dropout: 0.0
  act: leaky_relu
attention:
  projection_dim: 32
  hidden_dim: 8
  dropout: 0.25
  init: kaiming # kaiming | default
task: ${task}
finetune: ${finetune}
optim: ${optim}
scheduler: ${scheduler}
# Pretrained encoder checkpoint (from regime=pretrain); null = random encoder.
init_from_ckpt: null
