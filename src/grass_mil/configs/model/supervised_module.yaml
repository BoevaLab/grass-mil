_target_: grass_mil.models.supervised_module.SupervisedModule
_recursive_: false

flags:
  use_ssl: false

encoder:
  input_dim: 0
  hidden_dim: 128
  out_dim: 128
  num_layers: 3
  dropout: 0.1
  conv_type: gin
  norm: batchnorm
  jk: last
  act: relu
  pooling: mean
  gat_heads: 4
  use_edge_attr: false
  edge_weight_index: 0
  edge_attr_dim: null
  # Selects a single scalar edge column (the edge length) for GINE message
  # passing; null passes the whole edge_attr vector through.
  edge_feature_index: null
  # Learned embedding of a categorical node label, summed with the projection
  # of the continuous features. null disables it (features come from `x` only).
  categorical_embedding: null

# Attention block -- only used when task.aggregation == mil_attention.
attention:
  attention_type: gated_projected
  input_dim: 128
  projection_dim: 64
  hidden_dim: 16
  dropout: false
  # Must equal graph_head.output_dim: attention is per-class.
  n_classes: 1

graph_head:
  input_dim: 128
  output_dim: 1
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

loss:
  loss_type: ${task.loss}

optim: ${oc.select:optim,null}
scheduler: ${oc.select:scheduler,null}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
freeze_encoder: false
