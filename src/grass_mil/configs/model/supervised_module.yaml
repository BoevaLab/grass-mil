defaults:
  - encoder: gin
  - attention: gated_projected
  - _self_

_target_: grass_mil.models.supervised_module.SupervisedModule
_recursive_: false

flags:
  use_ssl: false

# `encoder` and `attention` come from the model/encoder and model/attention
# groups (override with `model/encoder=gine_length`, `model/attention=gated`).
# The attention block is only used when task.aggregation == mil_attention.

graph_head:
  input_dim: ${model.encoder.out_dim}
  output_dim: 1
  hidden_dim: ${model.encoder.out_dim}
  # 2 = MLP instance head (default); 1 = linear head, required by the probe
  # pre-fit regimes (grass-mil-probe folds a logistic regression into it).
  num_layers: 2
  dropout: 0.0

ssl:
  method: bgrl
  predictor:
    hidden_size: 512

loss:
  loss_type: ${task.loss}

optim: ${oc.select:optim,null}
scheduler: ${oc.select:scheduler,null}
task: ${task}

init_from_ckpt: null
init_strict: false
encoder_init_map: auto_bgrl_or_identity
freeze_encoder: false
