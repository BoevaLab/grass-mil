# grass-mil-nested-cv: nested, patient-grouped cross-validation.
#
#   grass-mil-nested-cv experiment=my_cohort model.init_from_ckpt=<pretrain>/checkpoints/last.ckpt
#
# For every outer fold, the other folds form the development set. It is split
# into `inner_k` group-aware inner folds (stratified for classification); each
# inner run trains with the selected regime and records the epoch with the best
# `task.selection.metric`. The model is then refitted on the whole development
# set for the reduced number of epochs (no validation, last weights) and scored
# once on the held-out fold, on every cell.
defaults:
  - train
  - _self_

task_name: nested_cv

nested_cv:
  folds_file: ??? # JSON list of lists of unit (or region / sample) ids
  inner_k: 3
  inner_seed: 0
  epoch_reduce: median # median | mean | max, over the inner best epochs
  min_refit_epochs: 1
  outer_folds: null # e.g. [2] to run one outer fold; null = all
  resume: true # reuse finished inner runs and outer folds
