# grass-mil-niches: niche discovery on a trained model's cell cache.
#
#   grass-mil-niches cells_dir=<extract_out>/cells/fold2 output_dir=niches_fold2
#   grass-mil-niches cells_dir=... clustering.method=kmeans clustering.n_clusters=12
#   grass-mil-niches cells_dir=... space=attention attention_ckpt=<run>/checkpoints/last.ckpt
#
# The defaults are the preprint's recipe; every reduction / clustering key is
# a plain override (any backend of grass_mil.interpretability.core.clustering).
defaults:
  - _self_
  - paths: default
  - hydra: default

task_name: niches
cells_dir: ??? # one model's cache directory written by grass-mil-extract
output_dir: ${paths.output_dir}
regions: held_out # held_out | all | list of region ids | path to .json/.txt
labels:
  # Optional label CSV overriding the labels stored in the cache.
  label_file: null
  id_column: REGION_ID
  label_column: null
space: gnn # gnn (encoder embedding) | attention (8-d pre-tanh attention space)
attention_ckpt: null # checkpoint of the model; required for space=attention
positive_class: 1
positive_name: positive
title: null # report title (default from the cache name)
held_out_auroc: null # optional, printed in the report header

reduction:
  method: pca # pca | none | umap
  n_components: 10
  random_state: 42
clustering:
  method: hdbscan # hdbscan | kmeans | agglomerative | dbscan | optics | spectral
  n_clusters: null # for kmeans / agglomerative / spectral
  random_state: 42
  params:
    min_cluster_size: 300
    min_samples: 1
    cluster_selection_method: eom
sample_size: 100000 # cells used to fit the reducer and the clustering (null = all)
l2_normalise: true # cluster on L2-normalised coordinates (cosine geometry)
assign_k: 15 # k-NN assignment of unsampled cells on the reduced coordinates
seed: 0

present_threshold: 0.02 # a niche is "present" in a region above this share
n_boot: 2000 # bootstrap over regions for the margin CI
figures: true
umap:
  enabled: true
  n_neighbors: 30
  min_dist: 0.1
  metric: cosine
