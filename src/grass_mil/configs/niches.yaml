# grass-mil-niches: niches of one model's cells (see docs/niche_analysis.md).
#
#   grass-mil-niches cells_dir=<extract output>/cells/fold0
#
# Cells are clustered in the model's attention space, each niche is described by
# its composition, empirical association and attention-weighted margin, and by
# spatial descriptors computed within the niche.
defaults:
  - _self_
  - paths: default
  - hydra: default

task_name: niches
cells_dir: ??? # one model's cache, written by grass-mil-extract
output_dir: ${paths.output_dir}
units: held_out # held_out (units the model did not train on) | all | list / file of unit ids
positive_class: 1
positive_name: positive
title: null

clustering:
  space: attention # attention | embedding
  pca_components: null # e.g. 10 with space=embedding
  cosine: true
  method: hdbscan # hdbscan | kmeans
  min_cluster_size: 300
  min_samples: 1
  selection: eom
  n_clusters: 10 # kmeans only
  sample_size: 100000 # cells used to fit the clustering (null = all)
  assign_k: 15 # neighbours assigning the remaining cells
  seed: 0

present_threshold: 0.02 # a niche is present in a unit above this share
enrichment_threshold: 1.5 # cell types over-represented by more than this factor
n_boot: 2000 # bootstrap over units for the margin interval

descriptors:
  analyses: [moran, enrichment, cross_l, contacts]
  min_cells: 20 # cells of a niche in a unit needed to describe it
  n_perms: 100
  n_radii: 20
  max_radius: null # null = a quarter of the median unit diagonal
  min_contacts: 100
  max_edge_length: null
  seed: 0

# Optional: niche shares versus survival (one row per patient).
survival:
  file: null
  id_column: patient_id
  time_column: time
  event_column: event
  pseudo_share: 0.001
  score: [] # e.g. ["Niche 1", "-Niche 4"] for Kaplan-Meier curves of score tertiles

figures: true
render_units: 4 # maps of the most positive and most negative units
