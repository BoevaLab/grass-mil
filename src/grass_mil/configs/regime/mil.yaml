# @package _global_
# GRASS-MIL default regime: BGRL-initialised encoder fine-tuned end to end,
# MLP instance head, projected gated attention, one region per bag.
# Every value below is a plain override and can be changed on the command line
# (e.g. `regime=mil task.region_accumulation.hyperbatch_size=8`).
defaults:
  - override /model: grass_mil
  - override /task: finetune_mil
  - override /scheduler: cosine_mil_step
  - override /callbacks: mil_selection
  - override /data/sampler: ego_graph_mil

regime_name: mil

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-3

task:
  optimization:
    encoder_lr_scale: 1.0
    head_lr_scale: 1.0
    attention_lr_scale: 2.0
    head_weight_decay: null
  finetune_augmentation:
    drop_edge_p: 0.0
    drop_feat_p: 0.0
  region_accumulation:
    hyperbatch_size: 12
  grad_clip_norm: 1.0

model:
  encoder:
    dropout: 0.0
  graph_head:
    num_layers: 2

data:
  sampler:
    runtime:
      subsample_count: 256
  # Validation on a FIXED 1024-root subset per region, so epoch-to-epoch metric
  # differences reflect the model rather than the root sample.
  val_sampler:
    name: shadow_custom
    kwargs: {}
    runtime:
      enabled: true
      depth: ${data.sampler.runtime.depth}
      num_neighbors: ${data.sampler.runtime.num_neighbors}
      subgraph_batch_size: 64
      replace: false
      shuffle_subgraphs: false
      proportional_root_sampling: false
      subsample_count: 1024
      fixed_per_unit_seed: 0
      unit_as_bag: false
      merge_units: false
      interior_seeds: ${data.sampler.runtime.interior_seeds}
      ego_radius: ${data.sampler.runtime.ego_radius}

trainer:
  max_epochs: 25
  min_epochs: 10
  precision: 16-mixed
