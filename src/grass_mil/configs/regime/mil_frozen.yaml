# @package _global_
# Frozen encoder (learning-rate scale 0, kept in eval mode); MLP head and
# attention trained on the pretrained embeddings. Larger bags fit in memory
# because no activations are stored for the encoder.
defaults:
  - mil

regime_name: mil_frozen

task:
  optimization:
    encoder_lr_scale: 0.0

data:
  sampler:
    runtime:
      subsample_count: 512
