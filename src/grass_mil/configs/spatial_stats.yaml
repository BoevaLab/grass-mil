# grass-mil-spatial-stats: classical spatial statistics per region, compared
# between classes at the patient level.
#
#   grass-mil-spatial-stats cells_dir=<extract_out>/cells/<model> \
#       labels.label_file=labels.csv labels.label_column=STAS labels.patient_column=PATIENT \
#       reference=[tumor] partners=[myeloid,CD8] infiltrating=[myeloid,CD8]
#
# Any model's cache works: only cell types, positions and the cell graph are used.
defaults:
  - _self_
  - paths: default
  - hydra: default

task_name: spatial_stats
cells_dir: ???
output_dir: ${paths.output_dir}
regions: null # list / .json / .txt of region ids; null = all cached regions
labels:
  label_file: ???
  id_column: REGION_ID
  label_column: ???
  patient_column: null
positive_name: positive
analyses: [nhood, cn, contacts, crossk]
# Optional fine -> coarse cell-type grouping ({fine: group}); identity by default.
group_map: {}
reference: [] # reference group(s) for contacts and cross-K (e.g. [tumor]); empty skips both
partners: null # partner groups (null = every other group)
infiltrating: [] # groups whose "intra-reference" fraction is reported
nhood:
  n_perms: 200
  backend: numpy # numpy | squidpy
cn:
  window_k: 10
  n_cn: 10
  sample_size: 200000
crossk:
  radii: [20, 50, 100]
seed: 0
min_per_group: 10 # patients per class needed for a test
