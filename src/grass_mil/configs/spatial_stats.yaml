# grass-mil-spatial-stats (optional): model-free spatial statistics of every unit,
# compared between positive and other patients.
#
#   grass-mil-spatial-stats cells_dir=<extract output>/cells/fold0 reference=[tumor]
#
# Only the cell types, positions and the cell graph of the cache are used, so
# any model's cache of the cohort gives the same result.
defaults:
  - _self_
  - paths: default
  - hydra: default

task_name: spatial_stats
cells_dir: ???
output_dir: ${paths.output_dir}
units: all # all | held_out | list / file of unit ids
positive_class: 1
analyses: [enrichment, neighbourhoods, contacts, cross_l]
# Optional fine -> coarse cell-type grouping ({fine: group}); identity by default.
group_map: {}
reference: [] # group(s) whose contacts and cross-L with the other groups are measured
n_perms: 200 # enrichment permutations
neighbourhoods:
  window: 10 # nearest neighbours per window
  n: 10 # neighbourhood clusters
  sample_size: 200000
radii: [20.0, 50.0, 100.0] # cross-L radii, coordinate units
min_patients: 10 # per class, for a test
seed: 0
