# @package _global_

task:
  name: finetune_mil
  aggregation: mil_attention
  bag_key: patch_id
  bag_fallback_key: sample_id
  max_instances_per_bag: 0
  instance_sampling: all
  target_type: binary
  target_columns: null
  loss: categorical_bce
  optimization:
    backbone_lr: null
    attention_lr: null
  lr_warmup:
    enabled: false
    warmup_steps: 0
    start_factor: 0.1
  # Hyperbatch has one meaning only:
  # number of regions accumulated before one optimizer/scheduler step.
  region_accumulation:
    enabled: false
    mode: manual_region_buffer
    hyperbatch_size: 8
    flush_on_epoch_end: true
  node_aux:
    enabled: false
    # graph_label | attention_shaped_ti
    target_mode: attention_shaped_ti
    # bce | weighted_bce
    loss_mode: bce
    weight: 1.0
  entropy_reg:
    enabled: false
    # attention | attention_shaped_target
    mode: attention_shaped_target
    weight: 0.01
  loss_weights:
    region: 1.0
    node_aux: 1.0
    entropy: 0.0
