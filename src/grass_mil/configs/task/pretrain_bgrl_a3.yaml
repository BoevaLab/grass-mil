# @package _global_
# BGRL pretraining, preprint "A3" recipe: AdamW 5e-5 / weight decay 1e-5,
# linear LR warmup over 1000 steps then cosine to 1e-7 at 200k steps, target
# EMA momentum 0.99 -> 1.0 (cosine, no warmup), symmetric augmentations
# DropImportance(mu 0.25, p_lambda 0.45, degree importance, unassigned token)
# + Gaussian noise (std 0.2) on the cell-size feature, checkpoint every 5000
# steps, all regions used label-free.
defaults:
  - override /scheduler: cosine_step
  - override /optim: adamw

optim:
  lr: 5.0e-5
  weight_decay: 1.0e-5

scheduler:
  T_max: auto # = total_steps - lr warmup
  eta_min: 1.0e-7

task:
  name: pretrain_bgrl
  aggregation: mean
  bag_key: patch_id
  bag_fallback_key: sample_id
  max_instances_per_bag: 0
  instance_sampling: all
  target_type: binary
  target_columns: null
  loss: categorical_bce
  lr_warmup:
    enabled: true
    warmup_steps: 1000
    start_factor: 0.0 # linear from ~0
  warmup_steps: 1000
  total_steps: 200000
  momentum: 0.99
  momentum_final: 1.0
  momentum_warmup_steps: 0
  augmentation_seed: 0
  augmentation:
    mode: importance
    mu: 0.25
    p_lambda: 0.45
    feature_noise_std: 0.2
    # Continuous node feature(s) to noise, by name (molecular_columns) or index.
    # Set to [] for cohorts without a cell-size feature.
    feature_noise_columns: [SIZE]

trainer:
  max_steps: ${task.total_steps}
  max_epochs: -1
  precision: 16-mixed
  val_check_interval: null
