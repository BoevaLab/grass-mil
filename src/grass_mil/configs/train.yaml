# grass-mil-train: one training run (fine-tuning by default, `regime=pretrain`
# for label-free encoder pretraining). Every key below can be overridden on the
# command line; see docs/configuration.md.
defaults:
  - _self_
  - data: spatial_omics
  - model: grass_mil
  - task: classification
  - optim: adamw
  - scheduler: cosine
  - callbacks: selection
  - logger: null
  - trainer: default
  - paths: default
  - hydra: default
  # A cohort description (configs/experiment/example_cohort.yaml as template).
  - experiment: null
  # Training procedure: finetune (default), finetune_reg, attention_only,
  # mlp_head, mlp_head_frozen, or pretrain.
  - regime: finetune

task_name: train
seed: 0
# Fit the model, then score the test split with the selected checkpoint.
train: true
test: true
# Resume an interrupted run from this checkpoint.
ckpt_path: null
# Print the composed config at the start of the run.
print_config: false
